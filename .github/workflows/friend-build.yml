name: for friend
run-name: for friend

on:
  push:
    branches: [main]
    paths:
      - app/src/main/java/com/example/fitnessapp/network/ApiClient.kt
      - .github/workflows/friend-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew

      - name: Test and build friend APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload friend APK
        uses: actions/upload-artifact@v7
        with:
          name: blushfit-for-friend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
